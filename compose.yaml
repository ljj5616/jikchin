services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: jikchin
      MYSQL_USER: jikchin_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  app:
    build:
      context: .
    environment:
      DB_URL: jdbc:mysql://mysql:3306/jikchin?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: jikchin_app
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env}
      ASSETS_BASE_URL: ${ASSETS_BASE_URL:?Set ASSETS_BASE_URL in .env}
      REPORTS_ENABLED: ${REPORTS_ENABLED:-true}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      AVATAR_S3_BUCKET: ${AVATAR_S3_BUCKET:-jikchin-avatar-storage}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      JPA_DDL_AUTO: validate
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
