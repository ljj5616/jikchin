name: jikchin-prod

services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE in .env.prod}
    environment:
      DB_URL: ${DB_URL:?Set DB_URL in .env.prod}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env.prod}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.prod}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.prod}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env.prod}
      ASSETS_BASE_URL: ${ASSETS_BASE_URL:?Set ASSETS_BASE_URL in .env.prod}
      REPORTS_ENABLED: ${REPORTS_ENABLED:-true}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      AVATAR_S3_BUCKET: ${AVATAR_S3_BUCKET:-jikchin-avatar-storage}
      JPA_DDL_AUTO: validate
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
