name: app-ci

on:
  workflow_dispatch:
  push:
    branches: [ main, develop, 'feat/**', 'fix/**', 'chore/**' ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: jikchin_test
          MYSQL_USER: jikchin_test
          MYSQL_PASSWORD: ci-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (with Gradle cache)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Verify deployment scripts
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Build
        run: ./gradlew clean build --no-daemon

      - name: Verify MySQL migrations
        run: ./gradlew mysqlTest --no-daemon
        env:
          MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:3306/jikchin_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
          MYSQL_TEST_USERNAME: jikchin_test
          MYSQL_TEST_PASSWORD: ci-test-password

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start Docker services
        run: docker compose --project-name jikchin-ci --env-file .env.example up --build -d

      - name: Verify application starts
        run: curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors --retry-max-time 120 --max-time 5 http://127.0.0.1:8080/v3/api-docs -o /dev/null

      - name: Show container logs on failure
        if: failure()
        run: docker compose --project-name jikchin-ci --env-file .env.example logs --no-color

      - name: Clean up CI containers and test data
        if: always()
        run: docker compose --project-name jikchin-ci --env-file .env.example down --volumes

  publish-image:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [build, docker-smoke]
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.publish.outputs.image_uri }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECR_REPOSITORY: jikchin-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check AWS role configuration
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error::Set the AWS_ROLE_ARN repository variable to the GitHub Actions IAM role ARN."
            exit 1
          fi

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: publish
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker build --tag "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "Published image: \`$IMAGE_URI\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: publish-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: jikchin-production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      IMAGE_URI: ${{ needs.publish-image.outputs.image_uri }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout the image's source
        uses: actions/checkout@v4

      - name: Skip an outdated main revision
        id: current
        env:
          REVISION: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          current_sha=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$REVISION" = "$current_sha" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'Skipping deployment because main has moved to a newer commit.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure AWS credentials using OIDC
        if: steps.current.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy on EC2 and wait for the result
        if: steps.current.outputs.deploy == 'true'
        run: python3 scripts/dispatch_deploy.py
