name: app-ci

on:
  workflow_dispatch:
  push:
    branches: [ main, develop, 'feat/**', 'fix/**', 'chore/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: jikchin_test
          MYSQL_USER: jikchin_test
          MYSQL_PASSWORD: ci-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (with Gradle cache)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew clean build --no-daemon

      - name: Verify MySQL migrations
        run: ./gradlew mysqlTest --no-daemon
        env:
          MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:3306/jikchin_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
          MYSQL_TEST_USERNAME: jikchin_test
          MYSQL_TEST_PASSWORD: ci-test-password

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start Docker services
        run: docker compose --project-name jikchin-ci --env-file .env.example up --build -d

      - name: Verify application starts
        run: curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors --retry-max-time 120 --max-time 5 http://127.0.0.1:8080/v3/api-docs -o /dev/null

      - name: Show container logs on failure
        if: failure()
        run: docker compose --project-name jikchin-ci --env-file .env.example logs --no-color

      - name: Clean up CI containers and test data
        if: always()
        run: docker compose --project-name jikchin-ci --env-file .env.example down --volumes
